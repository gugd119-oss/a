<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三公游戏 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: none;
        }
        .card-header {
            border-radius: 15px 15px 0 0 !important;
            background-color: #495057;
            color: white;
            font-weight: bold;
        }
        .btn-admin {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-admin:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
            color: white;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
    </style>
</head>
<body>
    <div id="loading" style="display: none;">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>

    <!-- 头部 -->
    <div class="admin-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="bi bi-gear-fill"></i> <span data-i18n="admin.title">三公游戏管理后台</span></h1>
                    <p class="mb-0" data-i18n="admin.subtitle">管理费率、合伙人、管理员和系统设置</p>
                </div>
                <div class="col-md-4 text-end">
                    <div id="walletInfo" class="d-inline-flex align-items-center">
                        <span id="walletAddress" class="badge bg-light text-dark" data-i18n="wallet.disconnected">未连接钱包</span>
                        <button id="connectWalletBtn" class="btn btn-outline-light btn-sm ms-2" data-i18n="wallet.connect">连接钱包</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 权限检查提示 -->
        <div id="permissionAlert" class="alert alert-warning" role="alert" style="display: none;">
            <i class="bi bi-exclamation-triangle-fill"></i> 您没有管理员权限，无法使用此功能
        </div>

        <!-- 连接钱包提示 -->
        <div id="walletAlert" class="alert alert-info" role="alert">
            <i class="bi bi-wallet2"></i> 请先连接您的钱包以使用管理功能
        </div>

        <div class="row">
            <!-- 费率管理 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-percent"></i> 费率设置</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="platformFee" class="form-label">平台费率 (%)</label>
                            <input type="number" class="form-control" id="platformFee" min="0" max="10" step="0.1" value="3">
                        </div>
                        <div class="mb-3">
                            <label for="inviterFee" class="form-label">邀请者费率 (%)</label>
                            <input type="number" class="form-control" id="inviterFee" min="0" max="5" step="0.1" value="2">
                        </div>
                        <div class="mb-3">
                            <label for="creatorFee" class="form-label">房主费率 (%)</label>
                            <input type="number" class="form-control" id="creatorFee" min="0" max="5" step="0.1" value="2">
                        </div>
                        <div class="mb-3">
                            <div class="alert alert-info">
                                <strong>总费率:</strong> <span id="totalFeeDisplay">7%</span>
                            </div>
                        </div>
                        <button id="updateFeesBtn" class="btn btn-admin w-100">
                            <i class="bi bi-save"></i> 更新费率
                        </button>
                    </div>
                </div>
            </div>

            <!-- 合伙人管理 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-people"></i> 合伙人管理</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="partnerAddress" 
                                       placeholder="合伙人钱包地址">
                            </div>
                            <div class="col-md-4">
                                <input type="number" class="form-control" id="partnerShare" 
                                       min="1" max="50" value="10" placeholder="分红%">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <button id="addPartnerBtn" class="btn btn-success w-100">
                                    <i class="bi bi-person-plus"></i> 添加
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button id="updatePartnerBtn" class="btn btn-warning w-100">
                                    <i class="bi bi-pencil"></i> 更新
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button id="removePartnerBtn" class="btn btn-danger w-100">
                                    <i class="bi bi-person-dash"></i> 删除
                                </button>
                            </div>
                        </div>
                        <button id="loadPartnersBtn" class="btn btn-outline-secondary w-100 mb-3">
                            <i class="bi bi-list"></i> 查看合伙人列表
                        </button>
                        <div id="partnersResult" class="mt-3"></div>
                    </div>
                </div>

                <!-- 系统设置 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-gear-fill"></i> 系统设置</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="minBetAmount" class="form-label">最小下注金额</label>
                            <input type="number" class="form-control" id="minBetAmount" min="1" value="10">
                        </div>
                        <button id="updateSystemBtn" class="btn btn-admin w-100 mb-2">
                            <i class="bi bi-check-circle"></i> 更新系统设置
                        </button>
                        <button id="loadSettingsBtn" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-arrow-clockwise"></i> 刷新设置
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 管理员和试用用户管理 -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-shield-check"></i> 管理员管理</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="adminAddress" 
                                       placeholder="管理员地址">
                            </div>
                            <div class="col-md-4">
                                <button id="addAdminBtn" class="btn btn-warning w-100">
                                    <i class="bi bi-person-plus"></i> 添加
                                </button>
                            </div>
                        </div>
                        <button id="removeAdminBtn" class="btn btn-outline-danger w-100">
                            <i class="bi bi-person-dash"></i> 移除管理员
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-people-fill"></i> 管理员列表</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6>当前管理员</h6>
                                <button id="loadAdminsBtn" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-arrow-clockwise"></i> 刷新列表
                                </button>
                            </div>
                        </div>
                        <div id="adminsList">
                            <div class="text-center text-muted">
                                <i class="bi bi-hourglass-split"></i> 加载中...
                            </div>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted">
                                <strong>说明：</strong><br>
                                • 合约所有者拥有最高权限<br>
                                • 管理员可以管理费率、合伙人等功能<br>
                                • 只有合约所有者可以添加/移除管理员
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 房间管理 -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-house"></i> 房间管理</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <input type="number" class="form-control" id="roomId" 
                                       placeholder="房间ID">
                            </div>
                            <div class="col-md-3">
                                <button id="queryRoomBtn" class="btn btn-admin w-100">
                                    <i class="bi bi-search"></i> 查询房间
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="closeRoomBtn" class="btn btn-danger w-100">
                                    <i class="bi bi-x-circle"></i> 关闭房间
                                </button>
                            </div>
                            <div class="col-md-3">
                                <button id="getStatsBtn" class="btn btn-outline-secondary w-100">
                                    <i class="bi bi-bar-chart"></i> 统计信息
                                </button>
                            </div>
                        </div>
                        <div id="roomResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作日志 -->

            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-clock-history"></i> 操作日志</h5>

                            <div class="text-center text-muted">暂无操作记录</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        let web3;
        let contract;
        let currentAccount;
        let isAdmin = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            setupEventListeners();
            checkWalletConnection();
            updateTotalFeeDisplay();
        }

        function setupEventListeners() {
            // 钱包连接
            document.getElementById('connectWalletBtn').addEventListener('click', connectWallet);
            
            // 白名单功能已废除
            
            // 费率管理
            document.getElementById('updateFeesBtn').addEventListener('click', updateFeeRates);
            
            // 合伙人管理
            document.getElementById('addPartnerBtn').addEventListener('click', addPartner);
            document.getElementById('updatePartnerBtn').addEventListener('click', updatePartner);
            document.getElementById('removePartnerBtn').addEventListener('click', removePartner);
            document.getElementById('loadPartnersBtn').addEventListener('click', loadPartners);
            
            // 系统设置
            document.getElementById('updateSystemBtn').addEventListener('click', updateSystemSettings);
            document.getElementById('loadSettingsBtn').addEventListener('click', loadSystemSettings);
            
            // 管理员列表
            document.getElementById('loadAdminsBtn').addEventListener('click', loadAdmins);
            
            // 管理员管理
            document.getElementById('addAdminBtn').addEventListener('click', () => updateAdmin(true));
            document.getElementById('removeAdminBtn').addEventListener('click', () => updateAdmin(false));
            
            // 试用用户管理功能已废除
            
            // 房间管理
            document.getElementById('queryRoomBtn').addEventListener('click', queryRoomInfo);
            document.getElementById('closeRoomBtn').addEventListener('click', closeRoom);
            document.getElementById('getStatsBtn').addEventListener('click', getAntiCheatStats);
            
            // 费率输入监听
            ['platformFee', 'inviterFee', 'creatorFee'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateTotalFeeDisplay);
            });
        }

        // 钱包连接相关函数 - 使用与index.html相同的成功方法
        async function checkWalletConnection() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        await connectWallet();
                    }
                } catch (error) {
                    console.error('检查钱包连接失败:', error);
                }
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                showAlert('请安装MetaMask钱包', 'danger');
                return;
            }

            try {
                showLoading(true);
                
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                if (accounts.length === 0) {
                    throw new Error('未找到钱包账户');
                }

                currentAccount = accounts[0];
                web3 = new Web3(window.ethereum);
                contract = new web3.eth.Contract(contractAbi, contractAddress);
                
                updateWalletUI();
                await checkAdminPermission();
                
                if (isAdmin) {
                    await loadInitialData();
                }
                
                showAlert('钱包连接成功', 'success');
                
            } catch (error) {
                console.error('连接钱包失败:', error);
                showAlert('连接钱包失败: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }

        // 使用与index.html相同的交易发送方法 - 修复版本
        async function sendTransaction(method, params = [], gasLimit = null) {
            try {
                // 获取当前gas价格
                const gasPrice = await web3.eth.getGasPrice();
                console.log("当前gas价格:", gasPrice);
                
                let txParams = {
                    from: currentAccount,
                    gasPrice: web3.utils.toHex(Math.floor(parseInt(gasPrice) * 1.2)) // 增加20%的gas价格
                };
                
                // 估算gas用量
                if (!gasLimit) {
                    try {
                        const gasEstimate = await method.estimateGas(txParams);
                        console.log("估算gas用量:", gasEstimate);
                        txParams.gas = Math.floor(gasEstimate * 1.5); // 增加50%的gas限制
                    } catch (estimateError) {
                        console.warn("Gas估算失败，使用默认值:", estimateError);
                        txParams.gas = 500000; // 使用更高的固定gas限制
                    }
                } else {
                    txParams.gas = gasLimit;
                }
                
                // 发送交易
                const tx = await method.send(txParams);
                console.log("交易成功:", tx);
                return tx;
                
            } catch (error) {
                console.error("交易失败:", error);
                
                if (error.code === 4001) {
                    throw new Error('您拒绝了交易');
                } else if (error.message && error.message.includes("insufficient funds")) {
                    throw new Error('余额不足，请确保有足够的ETH支付gas费用');
                } else if (error.message && error.message.includes("execution reverted")) {
                    // 尝试解析具体的错误原因
                    if (error.message.includes("Only admin")) {
                        throw new Error('权限不足：需要管理员权限');
                    } else if (error.message.includes("Partner does not exist")) {
                        throw new Error('合伙人不存在');
                    } else {
                        throw new Error('交易被拒绝: ' + (error.reason || error.message));
                    }
                } else {
                    throw new Error(error.message || '交易失败');
                }
            }
        }

                showLoading(true);
                
                await sendTransaction(contract.methods.banTrialUser(address));
                
                showAlert('封禁用户成功', 'success');
                await queryTrialStatus();
                logOperation(`封禁用户: ${address}`);
                
            } catch (error) {
                console.error('封禁用户失败:', error);
                showAlert('封禁用户失败: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // 房间管理函数
        async function queryRoomInfo() {
            const roomId = parseInt(document.getElementById('roomId').value);
            
            if (isNaN(roomId) || roomId < 1) {
                showAlert('请输入有效的房间ID', 'warning');
                return;
            }

            try {
                showLoading(true);
                
                const result = await contract.methods.getRoomBasic(roomId).call({from: currentAccount});
                const creator = result[0];
                const originalCreator = result[1];
                const maxPlayers = result[2];
                const playerCount = result[3];
                const expireTime = result[4];
                const active = result[5];
                const nextDealTime = result[6];
                const dealInterval = result[7];
                const gameStarted = result[8];
                
                const expireDate = new Date(expireTime * 1000).toLocaleString();
                const nextDealDate = new Date(nextDealTime * 1000).toLocaleString();
                
                const resultDiv = document.getElementById('roomResult');
                resultDiv.innerHTML = `
                    <div class="alert alert-info">
                        <strong>房间ID:</strong> ${roomId}<br>
                        <strong>创建者:</strong> ${creator}<br>
                        <strong>原始创建者:</strong> ${originalCreator}<br>
                        <strong>最大玩家数:</strong> ${maxPlayers}<br>
                        <strong>当前玩家数:</strong> ${playerCount}<br>
                        <strong>过期时间:</strong> ${expireDate}<br>
                        <strong>房间状态:</strong> ${active ? '活跃' : '已关闭'}<br>
                        <strong>游戏状态:</strong> ${gameStarted ? '已开始' : '未开始'}<br>
                        <strong>下次发牌时间:</strong> ${nextDealDate}<br>
                        <strong>发牌间隔:</strong> ${dealInterval}秒
                    </div>
                `;
                
            } catch (error) {
                console.error('查询房间信息失败:', error);
                showAlert('查询房间信息失败: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        async function closeRoom() {
            const roomId = parseInt(document.getElementById('roomId').value);
            
            if (isNaN(roomId) || roomId < 1) {
                showAlert('请先查询房间信息', 'warning');
                return;
            }

            if (!confirm(`确定要关闭房间 ${roomId} 吗？`)) {
                return;
            }

            try {
                showLoading(true);
                
                await sendTransaction(contract.methods.closeRoom(roomId));
                
                showAlert('关闭房间成功', 'success');
                await queryRoomInfo();
                logOperation(`关闭房间: ${roomId}`);
                
            } catch (error) {
                console.error('关闭房间失败:', error);
                showAlert('关闭房间失败: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        async function getAntiCheatStats() {
            try {
                showLoading(true);
                
                const result = await contract.methods.getAntiCheatStats().call({from: currentAccount});
                const globalTrialCount = result;
                
                const resultDiv = document.getElementById('roomResult');
                resultDiv.innerHTML = `
                    <div class="alert alert-info">
                        <strong>防刷统计:</strong><br>
                        • 全局试用次数: ${globalTrialCount}<br>
                        • 系统运行正常
                    </div>
                `;
                
            } catch (error) {
                console.error('获取防刷统计失败:', error);
                showAlert('获取防刷统计失败: ' + error.message, 'danger');
            } finally {
                showLoading(false);
            }
        }

        // 工具函数
        function showLoading(show) {
            const loading = document.getElementById('loading');
            loading.style.display = show ? 'flex' : 'none';
        }

        function showAlert(message, type = 'info') {
            // 创建临时提示框
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 10000; max-width: 400px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 3000);
        }

        function logOperation(operation) {
            const logContainer = document.getElementById('operationLog');
            const timestamp = new Date().toLocaleString();
            
            const logEntry = document.createElement('div');
            logEntry.className = 'border-bottom pb-2 mb-2';
            logEntry.innerHTML = `
                <div class="d-flex justify-content-between">
                    <span><strong>${operation}</strong></span>
                    <small class="text-muted">${timestamp}</small>
                </div>
                <small class="text-muted">操作者: ${currentAccount}</small>
            `;
            
            // 插入到顶部
            if (logContainer.firstChild && logContainer.firstChild.textContent !== '暂无操作记录') {
                logContainer.insertBefore(logEntry, logContainer.firstChild);
            } else {
                logContainer.innerHTML = '';
                logContainer.appendChild(logEntry);
            }
            
            // 限制日志条数
            const logs = logContainer.children;
            if (logs.length > 20) {
                logContainer.removeChild(logs[logs.length - 1]);
            }
        }

        // 监听钱包账户变化
        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', function (accounts) {
                if (accounts.length === 0) {
                    currentAccount = null;
                    contract = null;
                    isAdmin = false;
                    updateWalletUI();
                    showAlert('钱包已断开连接', 'warning');
                } else if (accounts[0] !== currentAccount) {
                    location.reload();
                }
            });

            window.ethereum.on('chainChanged', function (chainId) {
                location.reload();
            });
        }
    </script>
</body>
</html>
